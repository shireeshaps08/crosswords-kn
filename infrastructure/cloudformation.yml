AWSTemplateFormatVersion: '2010-09-09'
Description: Kannada Crossword — scaled for 10k users (ECS Fargate + RDS + ElastiCache + CloudFront)

Parameters:
  AppName:        { Type: String, Default: crossword-kn }
  Environment:    { Type: String, Default: production }
  DBPassword:     { Type: String, NoEcho: true }
  JwtSecret:      { Type: String, NoEcho: true }
  BackendImage:   { Type: String }
  CertificateArn: { Type: String }
  DomainName:     { Type: String, Description: "e.g. crossword.yournewspaper.com" }

Resources:
  # ─── VPC ──────────────────────────────────────────────────────────────
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.0.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true

  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref VPC, CidrBlock: 10.0.1.0/24, AvailabilityZone: !Select [0, !GetAZs ''], MapPublicIpOnLaunch: true }
  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref VPC, CidrBlock: 10.0.2.0/24, AvailabilityZone: !Select [1, !GetAZs ''], MapPublicIpOnLaunch: true }
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref VPC, CidrBlock: 10.0.3.0/24, AvailabilityZone: !Select [0, !GetAZs ''] }
  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties: { VpcId: !Ref VPC, CidrBlock: 10.0.4.0/24, AvailabilityZone: !Select [1, !GetAZs ''] }

  IGW: { Type: AWS::EC2::InternetGateway }
  IGWAttach:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref VPC, InternetGatewayId: !Ref IGW }
  PublicRT:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VPC }
  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: IGWAttach
    Properties: { RouteTableId: !Ref PublicRT, DestinationCidrBlock: 0.0.0.0/0, GatewayId: !Ref IGW }
  PubSub1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet1, RouteTableId: !Ref PublicRT }
  PubSub2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PublicSubnet2, RouteTableId: !Ref PublicRT }

  # NAT for private subnets (backend → internet for npm, etc.)
  EIP: { Type: AWS::EC2::EIP, Properties: { Domain: vpc } }
  NAT:
    Type: AWS::EC2::NatGateway
    Properties: { AllocationId: !GetAtt EIP.AllocationId, SubnetId: !Ref PublicSubnet1 }
  PrivateRT:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref VPC }
  PrivateRoute:
    Type: AWS::EC2::Route
    Properties: { RouteTableId: !Ref PrivateRT, DestinationCidrBlock: 0.0.0.0/0, NatGatewayId: !Ref NAT }
  PrivSub1Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet1, RouteTableId: !Ref PrivateRT }
  PrivSub2Assoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { SubnetId: !Ref PrivateSubnet2, RouteTableId: !Ref PrivateRT }

  # ─── Security Groups ──────────────────────────────────────────────────
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB inbound
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0 }
        - { IpProtocol: tcp, FromPort: 80,  ToPort: 80,  CidrIp: 0.0.0.0/0 }

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ECS backend tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 4000, ToPort: 4000, SourceSecurityGroupId: !Ref ALBSecurityGroup }

  CacheSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ElastiCache Redis
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 6379, ToPort: 6379, SourceSecurityGroupId: !Ref AppSecurityGroup }

  DBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: RDS Proxy
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 5432, ToPort: 5432, SourceSecurityGroupId: !Ref AppSecurityGroup }

  # ─── ElastiCache Redis (session hot state + caching) ──────────────────
  CacheSubnetGroup:
    Type: AWS::ElastiCache::SubnetGroup
    Properties:
      Description: Redis subnets
      SubnetIds: [ !Ref PrivateSubnet1, !Ref PrivateSubnet2 ]

  RedisCluster:
    Type: AWS::ElastiCache::ReplicationGroup
    Properties:
      ReplicationGroupDescription: !Sub "${AppName} Redis"
      NumCacheClusters: 2                  # primary + 1 replica for HA
      CacheNodeType: cache.t4g.small
      Engine: redis
      EngineVersion: '7.1'
      AtRestEncryptionEnabled: true
      TransitEncryptionEnabled: true
      CacheSubnetGroupName: !Ref CacheSubnetGroup
      SecurityGroupIds: [ !Ref CacheSecurityGroup ]
      AutomaticFailoverEnabled: true

  # ─── RDS PostgreSQL + RDS Proxy (connection pooling) ──────────────────
  DBSubnetGroup:
    Type: AWS::RDS::DBSubnetGroup
    Properties:
      DBSubnetGroupDescription: Private RDS subnets
      SubnetIds: [ !Ref PrivateSubnet1, !Ref PrivateSubnet2 ]

  Database:
    Type: AWS::RDS::DBInstance
    DeletionPolicy: Snapshot
    Properties:
      DBName: crossword_kn
      DBInstanceIdentifier: !Sub "${AppName}-db"
      DBInstanceClass: db.t4g.small      # handles ~200 connections, upgradeable
      Engine: postgres
      EngineVersion: '16'
      MasterUsername: postgres
      MasterUserPassword: !Ref DBPassword
      AllocatedStorage: '20'
      StorageType: gp3
      StorageEncrypted: true
      MultiAZ: true                      # AZ failover for production
      VPCSecurityGroups: [ !Ref DBSecurityGroup ]
      DBSubnetGroupName: !Ref DBSubnetGroup
      BackupRetentionPeriod: 7
      DeletionProtection: true
      EnablePerformanceInsights: true

  DBProxyRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - { Effect: Allow, Principal: { Service: rds.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Statement:
              - { Effect: Allow, Action: [ secretsmanager:GetSecretValue ], Resource: !Ref AppSecrets }

  DBProxy:
    Type: AWS::RDS::DBProxy
    Properties:
      DBProxyName: !Sub "${AppName}-proxy"
      EngineFamily: POSTGRESQL
      RoleArn: !GetAtt DBProxyRole.Arn
      Auth:
        - { AuthScheme: SECRETS, IAMAuth: DISABLED, SecretArn: !Ref AppSecrets }
      VpcSubnetIds: [ !Ref PrivateSubnet1, !Ref PrivateSubnet2 ]
      VpcSecurityGroupIds: [ !Ref DBSecurityGroup ]
      RequireTLS: true

  DBProxyTargetGroup:
    Type: AWS::RDS::DBProxyTargetGroup
    Properties:
      DBProxyName: !Ref DBProxy
      TargetGroupName: default
      DBInstanceIdentifiers: [ !Ref Database ]

  # ─── Secrets Manager ──────────────────────────────────────────────────
  AppSecrets:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${AppName}/env"
      SecretString: !Sub |
        {
          "username": "postgres",
          "password": "${DBPassword}",
          "JWT_SECRET": "${JwtSecret}"
        }

  # ─── S3 + CloudFront (frontend CDN) ───────────────────────────────────
  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AppName}-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  CloudFrontOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AppName}-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal: { Service: cloudfront.amazonaws.com }
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${CloudFrontDistribution}"

  CloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        HttpVersion: http2and3
        DefaultRootObject: index.html
        Aliases: [ !Ref DomainName ]
        ViewerCertificate:
          AcmCertificateArn: !Ref CertificateArn
          SslSupportMethod: sni-only
          MinimumProtocolVersion: TLSv1.2_2021
        Origins:
          - Id: S3Origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            OriginAccessControlId: !Ref CloudFrontOAC
            S3OriginConfig: {}
          - Id: APIOrigin
            DomainName: !GetAtt ALB.DNSName
            CustomOriginConfig:
              HTTPSPort: 443
              OriginProtocolPolicy: https-only
        DefaultCacheBehavior:
          TargetOriginId: S3Origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6   # CachingOptimized
          Compress: true
        CacheBehaviors:
          - PathPattern: /api/*
            TargetOriginId: APIOrigin
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad  # CachingDisabled
            AllowedMethods: [GET, HEAD, OPTIONS, PUT, POST, PATCH, DELETE]
            CachedMethods: [GET, HEAD]
          - PathPattern: /health
            TargetOriginId: APIOrigin
            ViewerProtocolPolicy: https-only
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
        CustomErrorResponses:
          - ErrorCode: 404
            ResponseCode: 200
            ResponsePagePath: /index.html   # SPA routing
          - ErrorCode: 403
            ResponseCode: 200
            ResponsePagePath: /index.html

  # ─── ECS Cluster + auto-scaling ───────────────────────────────────────
  Cluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${AppName}-cluster"
      CapacityProviders: [ FARGATE, FARGATE_SPOT ]
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE
          Weight: 1
          Base: 2             # always keep 2 FARGATE tasks
        - CapacityProvider: FARGATE_SPOT
          Weight: 4           # burst traffic on cheaper SPOT

  ExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Statement:
          - { Effect: Allow, Principal: { Service: ecs-tasks.amazonaws.com }, Action: sts:AssumeRole }
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: SecretsAccess
          PolicyDocument:
            Statement:
              - { Effect: Allow, Action: [ secretsmanager:GetSecretValue ], Resource: !Ref AppSecrets }

  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${AppName}"
      RetentionInDays: 30

  BackendTaskDef:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${AppName}-backend"
      Cpu: '512'
      Memory: '1024'
      NetworkMode: awsvpc
      RequiresCompatibilities: [ FARGATE ]
      ExecutionRoleArn: !GetAtt ExecutionRole.Arn
      ContainerDefinitions:
        - Name: backend
          Image: !Ref BackendImage
          PortMappings: [ { ContainerPort: 4000 } ]
          Environment:
            - { Name: NODE_ENV,       Value: production }
            - { Name: PORT,           Value: '4000' }
            - { Name: DB_HOST,        Value: !GetAtt DBProxy.Endpoint }
            - { Name: DB_PORT,        Value: '5432' }
            - { Name: DB_NAME,        Value: crossword_kn }
            - { Name: DB_USER,        Value: postgres }
            - { Name: DB_SSL,         Value: 'true' }
            - { Name: JWT_EXPIRES_IN, Value: 7d }
            - { Name: REDIS_URL,      Value: !Sub "rediss://${RedisCluster.PrimaryEndPoint.Address}:6379" }
            - { Name: CORS_ORIGIN,    Value: !Sub "https://${DomainName}" }
          Secrets:
            - { Name: DB_PASSWORD, ValueFrom: !Sub "${AppSecrets}:password::" }
            - { Name: JWT_SECRET,  ValueFrom: !Sub "${AppSecrets}:JWT_SECRET::" }
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: backend
          HealthCheck:
            Command: [ CMD-SHELL, "curl -f http://localhost:4000/health || exit 1" ]
            Interval: 30
            Timeout: 5
            Retries: 3

  BackendService:
    Type: AWS::ECS::Service
    DependsOn: ALBListenerHTTPS
    Properties:
      Cluster: !Ref Cluster
      TaskDefinition: !Ref BackendTaskDef
      DesiredCount: 2
      NetworkConfiguration:
        AwsvpcConfiguration:
          AssignPublicIp: DISABLED
          Subnets: [ !Ref PrivateSubnet1, !Ref PrivateSubnet2 ]
          SecurityGroups: [ !Ref AppSecurityGroup ]
      LoadBalancers:
        - { ContainerName: backend, ContainerPort: 4000, TargetGroupArn: !Ref BackendTG }
      DeploymentConfiguration:
        MinimumHealthyPercent: 100
        MaximumPercent: 200

  # Auto-scaling: 2→10 tasks based on CPU and request count
  ScalableTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    Properties:
      MaxCapacity: 10
      MinCapacity: 2
      ResourceId: !Sub "service/${Cluster}/${BackendService.Name}"
      ScalableDimension: ecs:service:DesiredCount
      ServiceNamespace: ecs
      RoleARN: !Sub "arn:aws:iam::${AWS::AccountId}:role/aws-service-role/ecs.application-autoscaling.amazonaws.com/AWSServiceRoleForApplicationAutoScaling_ECSService"

  ScaleOutCPU:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: ScaleOutCPU
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref ScalableTarget
      TargetTrackingScalingPolicyConfiguration:
        TargetValue: 60.0
        PredefinedMetricSpecification:
          PredefinedMetricType: ECSServiceAverageCPUUtilization
        ScaleInCooldown: 300
        ScaleOutCooldown: 60

  # ─── ALB ──────────────────────────────────────────────────────────────
  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${AppName}-alb"
      Scheme: internet-facing
      SecurityGroups: [ !Ref ALBSecurityGroup ]
      Subnets: [ !Ref PublicSubnet1, !Ref PublicSubnet2 ]

  BackendTG:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Port: 4000
      Protocol: HTTP
      VpcId: !Ref VPC
      TargetType: ip
      HealthCheckPath: /health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      DeregistrationDelay: 30    # fast drain for zero-downtime deploys

  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - Type: redirect
          RedirectConfig: { Protocol: HTTPS, Port: '443', StatusCode: HTTP_301 }

  ALBListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      Certificates: [ { CertificateArn: !Ref CertificateArn } ]
      DefaultActions:
        - { Type: forward, TargetGroupArn: !Ref BackendTG }

Outputs:
  CloudFrontDomain:
    Value: !GetAtt CloudFrontDistribution.DomainName
    Description: Point your domain CNAME here (or use Route53 alias)
  FrontendBucket:
    Value: !Ref FrontendBucket
    Description: Upload built React app here — aws s3 sync frontend/dist s3://BUCKET
  ALBDomain:
    Value: !GetAtt ALB.DNSName
    Description: Backend ALB (used by CloudFront)
  RedisEndpoint:
    Value: !GetAtt RedisCluster.PrimaryEndPoint.Address
  DBProxyEndpoint:
    Value: !GetAtt DBProxy.Endpoint
