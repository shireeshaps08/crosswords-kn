services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: crossword_kn
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: devpassword
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: crossword_kn
      DB_USER: postgres
      DB_PASSWORD: devpassword
      DB_SSL: "false"
      REDIS_URL: redis://redis:6379
      JWT_SECRET: change_this_in_production_min_32_chars!!
      JWT_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:3200
    ports:
      - "4000:4000"

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "3200:80"

volumes:
  pgdata:
